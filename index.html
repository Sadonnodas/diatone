<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/diatone/favicon.ico" />
    <link rel="apple-touch-icon" href="/diatone/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Roman-numeral ↔ chord drill in all 12 major keys." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Diatone" />
    <title>Diatone</title>
    <script>
      // Set the theme before first paint, so a daylight user never sees a flash
      // of the night palette. Night unless the stored choice says otherwise —
      // mirrors storedPref()/resolve() in src/theme.tsx.
      (function () {
        var t = 'dark';
        try {
          var p = localStorage.getItem('diatone.theme');
          if (p === 'light') t = 'light';
          else if (p === 'auto')
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {
          /* storage or matchMedia blocked — stay on night */
        }
        document.documentElement.dataset.theme = t;
        // Short visible area (a phone browser with its toolbars, or a small
        // phone): the layout tightens a little. Set before paint so nothing
        // jumps; src/main.tsx keeps it current on resize.
        if (window.innerHeight < 800) document.documentElement.classList.add('short-screen');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#eaeef4' : '#0a0c10');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
